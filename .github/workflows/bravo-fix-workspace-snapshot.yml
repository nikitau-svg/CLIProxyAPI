name: Apply and verify Bravo failover source

on:
  pull_request:
    branches:
      - agent/bravo-0.6-production
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: bravo-final-source-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply-test-and-publish:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/bravo-0.7-claude-spark-failover'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Reconstruct and verify the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bravo-patch/part-* > /tmp/bravo-final.patch.gz.b64
          echo '84be229a467bc864959accb139ed004ce168f5368288a709acf5cfc1fbeca5bc  /tmp/bravo-final.patch.gz.b64' | sha256sum --check --strict
          base64 --decode /tmp/bravo-final.patch.gz.b64 | gzip --decompress > /tmp/bravo-final.patch
          echo '2a353ee2e151c1e9d063f200132a9deea1ec5200f017dee7528aa3450cb8774c  /tmp/bravo-final.patch' | sha256sum --check --strict

      - name: Apply source changes without workflow-file mutations
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --exclude='.github/workflows/*' /tmp/bravo-final.patch
          git apply --index --exclude='.github/workflows/*' /tmp/bravo-final.patch
          git diff --cached --check

      - name: Align legacy route tests with the Spark-only route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugins/bravo/go/bravo_test.go')
          text = path.read_text()
          text = text.replace(
              '\t\t"gpt-5.5", "gpt-5.4", "gpt-5.4-mini",\n\t}\n',
              '\t\t"gpt-5.5", "gpt-5.4", "gpt-5.4-mini",\n\t\t"spark", "gpt-5.3-codex-spark",\n\t}\n',
              1,
          )
          text = text.replace(
              '\tfor _, unsupported := range []string{"gpt-5.3-codex-spark", "codex-auto-review"} {\n',
              '\tfor _, unsupported := range []string{"codex-auto-review"} {\n',
              1,
          )
          text = text.replace(
              '\tfor name, model := range cfg.Models {\n\t\tfor _, item := range model.Candidates {\n',
              '\tfor name, model := range cfg.Models {\n\t\tif name == "spark" || name == codexSparkModelFamily {\n\t\t\tcontinue\n\t\t}\n\t\tfor _, item := range model.Candidates {\n',
              1,
          )
          text = text.replace(
              '\tfor name, model := range cfg.Models {\n\t\tif routeClassCapability(model) == capabilityImageGeneration {\n\t\t\tcontinue\n\t\t}\n',
              '\tfor name, model := range cfg.Models {\n\t\tif routeClassCapability(model) == capabilityImageGeneration || name == "spark" || name == codexSparkModelFamily {\n\t\t\tcontinue\n\t\t}\n',
              1,
          )
          path.write_text(text)

          path = Path('plugins/bravo/go/compatibility_management_test.go')
          text = path.read_text()
          text = text.replace(
              '\t\tif item.Provider == "gemini" || item.Model == "codex-auto-review" || item.Model == "gpt-5.3-codex-spark" {\n',
              '\t\tif item.Provider == "gemini" || item.Model == "codex-auto-review" {\n',
              1,
          )
          marker = '\tunknown := compatibilityModelByID(t, response, "claude", "claude-opus-6")\n'
          replacement = (
              '\tspark := compatibilityModelByID(t, response, "codex", codexSparkModelFamily)\n'
              '\tif spark.Classification != compatibilityYAMLFix || !spark.Detected.Host || spark.Detected.Bravo || spark.Detected.Route {\n'
              '\t\tt.Fatalf("Spark compatibility classification = %#v", spark)\n'
              '\t}\n'
              + marker
          )
          if marker not in text:
              raise SystemExit('compatibility test marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          gofmt -w plugins/bravo/go/bravo_test.go plugins/bravo/go/compatibility_management_test.go
          git add plugins/bravo/go/bravo_test.go plugins/bravo/go/compatibility_management_test.go
          git diff --cached --check

      - name: Verify Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --cached --name-only --diff-filter=ACMR -- '*.go')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            test -z "$unformatted" || {
              printf 'Unformatted Go files:\n%s\n' "$unformatted"
              exit 1
            }
          fi

      - name: Test host quota and plugin contracts
        run: go test ./internal/pluginhost/... ./sdk/pluginapi/... -count=1 -timeout=10m

      - name: Test Bravo plugin
        shell: bash
        working-directory: plugins/bravo/go
        run: |
          set +e
          go test ./... -count=1 -timeout=10m > /tmp/bravo-test.log 2>&1
          status=$?
          tail -n 120 /tmp/bravo-test.log
          exit "$status"

      - name: Upload Bravo test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bravo-test-diagnostics-${{ github.run_id }}
          path: /tmp/bravo-test.log
          if-no-files-found: warn
          retention-days: 1

      - name: Race-test Bravo plugin
        working-directory: plugins/bravo/go
        run: go test -race ./... -count=1 -timeout=15m

      - name: Vet Bravo plugin
        working-directory: plugins/bravo/go
        run: go vet ./...

      - name: Build CLIProxyAPI server
        run: go build ./cmd/server

      - name: Remove non-workflow transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bravo-patch .github/bravo-patch .github/one-shot
          git add -A
          git diff --cached --check

      - name: Commit and publish verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(bravo): keep Claude routes alive across quota uncertainty'
          git push origin HEAD:${GITHUB_HEAD_REF}
