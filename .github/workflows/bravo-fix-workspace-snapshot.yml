name: Bravo fix workspace snapshot

on:
  pull_request:
    branches:
      - agent/bravo-0.6-production
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create a source archive
        shell: bash
        run: git archive --format=tar.gz --output=/tmp/cliproxy-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: cliproxy-source-${{ github.sha }}
          path: /tmp/cliproxy-source.tar.gz
          if-no-files-found: error
          retention-days: 1
